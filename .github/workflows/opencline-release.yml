name: OpenCline CLI Release

on:
  push:
    tags:
      - "opencline-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing OpenCline release tag to build (opencline-vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-x64:
    name: Build Windows x64 executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release tag
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:TAG_INPUT -ne "") { $env:TAG_INPUT } else { $env:REF_NAME }
          if ($tag -notmatch '^opencline-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag must look like opencline-vX.Y.Z, got: $tag"
          }
          $version = $tag.Substring("opencline-v".Length)
          $packageVersion = (Get-Content apps/cli/package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $packageVersion) {
            throw "Tag version $version does not match apps/cli/package.json version $packageVersion"
          }
          "OPENCLINE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CLI unit tests
        run: bun -F @cline/cli test:unit

      - name: Build standalone executable
        run: bun run apps/cli/script/build.ts --single

      - name: Smoke test executable
        shell: pwsh
        run: |
          $exe = "apps/cli/dist/cli-windows-x64/bin/cline.exe"
          if (-not (Test-Path $exe)) { throw "Build did not produce $exe" }

          $versionOutput = (& $exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Executable --version failed with exit code $LASTEXITCODE" }
          $expectedVersion = (Get-Content apps/cli/package.json -Raw | ConvertFrom-Json).version
          if ($versionOutput -ne $expectedVersion) {
            throw "Expected version $expectedVersion, got '$versionOutput'"
          }

          $helpOutput = (& $exe --help | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Executable --help failed with exit code $LASTEXITCODE" }
          if ($helpOutput -notmatch 'doctor') { throw "Executable help output does not include the doctor command" }

          & $exe doctor --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Executable doctor --help failed with exit code $LASTEXITCODE" }

          Copy-Item $exe "opencline-windows-x64.exe"
          $hash = (Get-FileHash "opencline-windows-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  opencline-windows-x64.exe" | Set-Content "opencline-windows-x64.exe.sha256" -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.OPENCLINE_TAG }}
          name: OpenCline CLI ${{ env.OPENCLINE_TAG }}
          generate_release_notes: true
          files: |
            opencline-windows-x64.exe
            opencline-windows-x64.exe.sha256
